<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brenn Car Rental</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo"><span class="red-letter">B</span>RENN</div>
      <nav>
        <div class="nav-links">
          <span>About</span>
          <span>Car</span>
          <span>Become Partner</span>
          <span>Terms & Conditions</span>
          <span>Contact Us</span>
        </div>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-container">
        <div class="hero-text">
          <h1>We Have Prepared a Car For Your Trip</h1>
          <p>
            We have many types of cars that are ready for you to travel anywhere
            and anytime.
          </p>

          <div class="hero-design-elements">
            <div class="box-red">Get In Touch</div>
            <div class="box-outline">Our Car</div>
          </div>
          <img src="img/toyota.webp" alt="Toyota Camry" class="hero-car" />
        </div>
      </div>
    </section>
  </body>
</html>
